description: |
  Bienvenue !
   
   Voici quelques informations à savoir avant de commencer :
   
   1. Les défis sont de différentes catégories : Cryptographie, Stéganographie, OSINT, GeoInt, Programmation, etc.
   2. Chaque défi contient un **drapeau** (flag) que vous devez capturer pour obtenir des points.
   3. Les flags sont souvent au format `ctf{solution_du_drapeau}`.
   4. Vous pouvez utiliser tous les outils à votre disposition, mais la curiosité et l'intuition sont vos meilleures alliées.
   5. Chaque défi peut avoir une solution simple ou compliquée : soyez patient et persévérant !
   
   Pour valider ce premier challenge, mettez ctf{Lu_3t_4ppr0uv3}.
