description: |
  Votre tâche consiste à extraire un mot de passe secret caché dans un océan de lettres, nombres et symboles. Nous avons réussi à trouver l'expression régulière pour capturer le groupe correspondant et récupérer le flag. A vous de jouer !
    
   Message :
  > ctf{m8&BwS0tY3cn=iN\o7eYbCWyHJP4q42YxN(:33EpmF&5ukRogj[_#]ugzV7ECxs;k54VqdG5NQWd[[[pQeB:H:/I>IFl}
  > 
  Expression régulière :
  ctf{[^o]*([a-zA-Z0-9]*).*}
   
   format : ctf{solution}
